<?xml version="1.0" encoding="UTF-8"?>
<!--
  Borbads — icon set (Tese system)
  ────────────────────────────────────────────────────────
  Grid 24×24 · stroke 1.5 · round caps/joins · stroke="currentColor"
  Usage (HTML/Astro):
    <svg class="icon" width="24" height="24"><use href="/borbads-icons.svg#ic-metric"/></svg>
    .icon{ color: var(--accent); }   /* controls stroke via currentColor */
  Figma: import this file (each <symbol> imports as a vector group),
         or copy a single icon's shapes from the showcase HTML.
  Add a new icon: copy a <symbol> block, change the id, draw on the 24-grid.
-->
